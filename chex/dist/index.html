<body>
<main class="app">
<nav class="top">
<div class="brand">
<i>✦</i> chex</div>
<button id="lang">中文 / <b>EN</b>
</button>
</nav>
<div class="notice">学习与研究用途：本平台仅用于学习与研究，不用于临床诊断、治疗建议或医疗决策。</div>
<section class="grid">
<aside class="card side">
<span class="label">当前案例</span>
<div class="case">
<b>胸部 X 光 · 正位</b>
<small id="name">公开教学样例</small>
</div>
<hr class="line">
<span class="label">查看模式</span>
<button class="mode active" data-mode="observe">◉ 观察</button>
<button class="mode" data-mode="annotate">⌁ 标注</button>
<button class="mode" data-mode="compare">⇄ 对比</button>
<hr class="line">
<span class="label">查看工具</span>
<div class="tools">
<button id="zin">＋ 放大</button>
<button id="zout">－ 缩小</button>
<button id="rot">↻ 旋转</button>
<button id="flip">↔ 翻转</button>
<button id="inv">◐ 反色</button>
<button id="reset">↺ 复位</button>
</div>
</aside>
<section class="card" id="viewer">
<div class="bar">
<b id="title">观察模式</b>
<span id="zoomread">100%</span>
</div>
<div class="wrap" id="drop">
<canvas id="cv">
</canvas>
</div>
<div class="compare" id="compare">
<section>
<em>参考影像</em>
<canvas id="ref">
</canvas>
</section>
<section>
<em>当前影像</em>
<canvas id="cur">
</canvas>
</section>
</div>
<div class="tags">
<span class="tag good">仅本地处理</span>
<span class="tag">DICOM · PNG · JPG · WEBP</span>
<span class="tag" id="info">教学样例 · 已去标识化</span>
</div>
</section>
<aside class="right">
<section class="card panel">
<h2>导入影像</h2>
<div class="upload">拖入已去标识化的 DICOM 或图片<br>
<button class="primary" id="choose">选择文件</button>
<input class="file" id="file" type="file" accept=".dcm,.dicom,application/dicom,image/png,image/jpeg,image/webp">
</div>
<div class="actions">
<button id="refchoose">选择参考图</button>
<input class="file" id="reffile" type="file" accept=".dcm,.dicom,application/dicom,image/png,image/jpeg,image/webp">
</div>
<div class="status" id="status">已加载样例</div>
</section>
<section class="card panel">
<h2>窗宽与视图</h2>
<label class="row">亮度 <input id="bright" type="range" min="-80" max="80" value="0">
<output>0</output>
</label>
<label class="row">对比度 <input id="contrast" type="range" min="40" max="220" value="100">
<output>100</output>
</label>
<label class="row">缩放 <input id="zoom" type="range" min="50" max="300" value="100">
<output>100</output>
</label>
<div class="hint" id="hint">拖拽可平移，滚轮可缩放。</div>
</section>
<section class="card panel">
<h2>系统阅片</h2>
<label class="check">
<input type="checkbox">图像质量</label>
<label class="check">
<input type="checkbox">A · 气道</label>
<label class="check">
<input type="checkbox">B · 肺野与胸膜</label>
<label class="check">
<input type="checkbox">C · 心影与纵隔</label>
<label class="check">
<input type="checkbox">D · 膈肌</label>
<label class="check">
<input type="checkbox">E · 其他结构</label>
<div class="progress">
<i id="prog">
</i>
</div>
<div class="status" id="pt">已复核 0 / 6 项</div>
</section>
<section class="card panel">
<h2>标注</h2>
<small>标注模式下，在影像上右键点击添加标注；左键拖拽可平移影像。</small>
<input id="tagInput" placeholder="输入标签或描述，例如：右上肺野可疑阴影" style="width:100%;margin-top:8px;padding:8px;border:1px solid #ccd5df;border-radius:8px">
<ul class="marks" id="marks">
</ul>
<div class="actions">
<button id="clear">清除</button>
<button id="export">导出标注记录</button>
</div>
</section>
<section class="card panel">
<h2>学习记录</h2>
<textarea id="notes" placeholder="记录你的观察…">
</textarea>
<div class="actions">
<button id="save">保存到本设备</button>
<button id="clearnote">清空</button>
</div>
<div class="status" id="ns">
</div>
</section>
</aside>
</section>
</main>

function annotateAt(e){const p=imagePoint(e);if(p.x<0||p.x>1||p.y<0||p.y>1)return;S.m.push({...p,label:$('#tagInput').value.trim()||'学习标记'});selectedMark=-1;hoverMark=-1;$('#tagInput').value='';marks();draw()}
function clearHover(){if(selectedMark<0&&hoverMark>=0){hoverMark=-1;ensureMarkDetail();draw()}}
cv.onpointerdown=e=>{if(e.button===2&&S.mode==='annotate'){annotateAt(e);return}if(e.button!==0)return;const n=hitMark(e);if(n>=0){selectedMark=selectedMark===n?-1:n;hoverMark=-1;marks();draw();return}beginPan(e)};
cv.onpointermove=e=>{if(S.d){movePan(e);return}const n=hitMark(e);if(n!==hoverMark){hoverMark=n;ensureMarkDetail();draw()}cv.style.cursor=n>=0?'pointer':'grab'};cv.onpointerup=endPan;cv.onpointerleave=clearHover;cv.oncontextmenu=e=>e.preventDefault();
$('#clear').onclick=()=>{S.m=[];selectedMark=-1;hoverMark=-1;marks();draw()};$('#hint').textContent='拖拽可平移，滚轮可缩放。右键添加标注；悬停圆点查看描述。';marks();draw();
</script>
<style>.mark-edit{flex:0 0 auto;padding:2px 6px!important;font-size:.76rem!important;color:#167d70!important}</style>
<script>
/* A visible edit entry lets an existing annotation be revised without re-placing it. */
function marks(){const list=$('#marks');if(!S.m.length){selectedMark=-1;hoverMark=-1;list.innerHTML='<li>暂无标注</li>';ensureMarkDetail();return}list.innerHTML=S.m.map((m,i)=>`<li><div class="mark-item"><b>标注 #${i+1}</b><small>${esc(m.label||'学习标记')}</small></div><button class="mark-edit" data-edit="${i}">编辑</button><button class="mark-remove" title="删除标注" data-remove="${i}">×</button></li>`).join('');list.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{selectedMark=+b.dataset.edit;hoverMark=-1;marks();draw();setTimeout(()=>$('#markEdit')?.focus(),0)});list.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{const n=+b.dataset.remove;S.m.splice(n,1);if(selectedMark===n)selectedMark=-1;else if(selectedMark>n)selectedMark--;if(hoverMark===n)hoverMark=-1;else if(hoverMark>n)hoverMark--;marks();draw()});ensureMarkDetail()}
marks();
</script>
</body>
</html>
