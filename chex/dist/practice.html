<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>chex · 病例练习</title><style>
:root{--paper:#f3f6f8;--ink:#172334;--muted:#657487;--line:#d6e0e9;--teal:#087b72;--teal-soft:#e9f7f4;--dark:#17212b;--bad:#a94242}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,"Microsoft YaHei",sans-serif}.app{max-width:1440px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:1.35rem;font-weight:850;letter-spacing:-.02em}.brand span{color:var(--teal)}a{color:var(--teal);font-weight:750;text-decoration:none}.notice{margin:16px 0;padding:10px 14px;border:1px solid #efd89b;border-radius:10px;background:#fff9eb;color:#72531a;font-size:.9rem}.grid{display:grid;grid-template-columns:250px minmax(500px,1fr) 350px;gap:16px}.card{background:white;border:1px solid var(--line);border-radius:14px;box-shadow:0 7px 20px #1736570d}.sidebar{padding:15px}.eyebrow{margin:0 0 9px;color:var(--muted);font-size:.76rem;font-weight:850;letter-spacing:.09em}.case{width:100%;margin:8px 0;padding:12px;text-align:left;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);cursor:pointer}.case:hover,.case.active{border-color:#80c7bd;background:var(--teal-soft)}.case b,.case small{display:block}.case small{margin-top:3px;color:var(--muted);font-size:.8rem}.status{display:inline-block;margin-top:7px;padding:1px 7px;border-radius:20px;background:#edf2f6;color:#546476;font-size:.74rem}.case.done .status{background:#dff2ed;color:#176a61}.viewer{overflow:hidden}.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 15px;background:var(--dark);color:#f4f8fa;font-size:.9rem}.image-zone{position:relative;height:min(72vh,760px);min-height:520px;background:#02080d;display:grid;place-items:center;overflow:hidden;cursor:crosshair;touch-action:none}.image-zone img{display:block;max-width:100%;max-height:100%;object-fit:contain;user-select:none;pointer-events:none}.location-dot{display:none;position:absolute;width:21px;height:21px;border:3px solid #ffcc52;border-radius:50%;background:#fff3b44d;box-shadow:0 0 0 4px #a5660029;transform:translate(-50%,-50%);pointer-events:none}.location-dot.show{display:block}.target{display:none;position:absolute;border:3px solid #f2b33e;background:#f2b33e22;border-radius:50%;pointer-events:none}.target.show{display:block}.image-tip{position:absolute;bottom:13px;left:13px;right:13px;padding:7px 10px;border-radius:7px;background:#07111bd9;color:#e8f0f5;font-size:.82rem;pointer-events:none}.meta{padding:8px 13px;color:var(--muted);font-size:.78rem}.panel{padding:17px}.panel h1{margin:0 0 4px;font-size:1.16rem}.stage{margin:0 0 13px;color:var(--teal);font-size:.86rem;font-weight:800}.instruction{margin:10px 0;padding:12px;border-left:3px solid var(--teal);border-radius:0 8px 8px 0;background:#f3faf9;color:#284a51}.choices{display:grid;gap:8px;margin:12px 0}.choice{padding:10px 11px;border:1px solid #cbd8e3;border-radius:9px;background:#fff;text-align:left;color:var(--ink);font:inherit;cursor:pointer}.choice:hover{border-color:var(--teal)}.choice.selected{border-color:var(--teal);background:var(--teal-soft);box-shadow:inset 0 0 0 1px var(--teal)}button.primary,button.quiet{padding:9px 13px;border-radius:8px;font:inherit;font-weight:800;cursor:pointer}button.primary{border:0;background:var(--teal);color:#fff}button.primary:disabled{background:#9ebbb7;cursor:not-allowed}button.quiet{margin-left:7px;border:1px solid #bdcedc;background:#fff;color:#2b4963}.feedback{display:none;margin-top:13px;padding:12px;border-radius:9px;background:#eff7f6;color:#22544e;font-size:.9rem}.feedback.show{display:block}.feedback.bad{background:#fff2f0;color:#843d39}.explanation{display:none;margin-top:12px;padding:13px;border:1px solid #bcded8;border-radius:9px;background:#f4fbf9}.explanation.show{display:block}.explanation h2{margin:0 0 6px;font-size:1rem}.note{margin:12px 0 0;color:var(--muted);font-size:.79rem}.source{color:var(--teal)}.summary{display:none}.summary.show{display:block}.summary li{margin:7px 0}.zoomrow{display:flex;gap:8px;align-items:center;margin-top:10px}.zoomrow input{accent-color:var(--teal);flex:1}@media(max-width:1050px){.grid{grid-template-columns:230px 1fr}.right{grid-column:1/-1}.image-zone{height:600px}.panel{max-width:none}}@media(max-width:700px){.app{padding:13px}.grid{display:block}.card{margin-bottom:12px}.image-zone{height:480px;min-height:420px}.sidebar{display:flex;overflow:auto;gap:8px}.sidebar .eyebrow,.sidebar .note{display:none}.case{min-width:215px;margin:0}.top{font-size:.9rem}}
</style></head><body><main class="app"><nav class="top"><div class="brand"><span>✦</span> chex · 病例练习</div><a href="./">返回阅片器</a></nav><div class="notice">本练习用于学习影像判读思路。病例标注与解释经过公开来源核对，但不能用于临床诊断或替代专业培训。</div><section class="grid"><aside class="card sidebar"><div><p class="eyebrow">胸片病例库 · 第一组</p><div id="caseList"></div><p class="note">每道题都有明确的影像任务和即时反馈；进度只保存在本设备。</p></div></aside><section class="card viewer"><div class="bar"><b id="caseTitle"></b><span id="viewerState">盲读</span></div><div class="image-zone" id="imageZone"><img id="caseImage" alt="公开教学胸片"><i class="target" id="target"></i><i class="location-dot" id="dot"></i><div class="image-tip" id="imageTip">先独立阅片。准备好后，回答右侧问题。</div></div><div class="meta" id="meta"></div></section><aside class="right"><section class="card panel" id="taskPanel"></section></aside></section></main><script>
const cases=[
{id:'pneumonia',title:'病例 01 · 右上肺叶实变影',level:'基础',img:'https://commons.wikimedia.org/wiki/Special:FilePath/Pneumonia_x_ray.jpg',source:'https://commons.wikimedia.org/wiki/File:Pneumonia_x_ray.jpg',credit:'CDC 公共卫生图像库，公共领域',target:{x:32,y:29,w:22,h:20},steps:[
{kind:'choice',title:'先作出总体判断',prompt:'这张胸片是否存在需要进一步解释的局灶性异常？',opts:['未见明确局灶异常','存在局灶性异常'],answer:1,feedback:'可以。下一步不要急于命名疾病，先把异常准确定位。'},
{kind:'locate',title:'在图上定位',prompt:'请点击你认为最需要解释的异常区域。点击后再提交。',feedback:'本例的公开图像说明为：患者右上肺叶可见增高的阴影。按常规阅片显示方向，它通常位于屏幕左上肺野。'},
{kind:'choice',title:'描述而非猜测',prompt:'最合适的第一句影像描述是？',opts:['右上肺野局灶性密度增高影','双肺弥漫性透亮度增加','左下肺肋膈角变钝','心影明显扩大'],answer:0,feedback:'正确。先以位置和密度描述发现，再将临床信息与其他征象结合，才考虑病因。'}]},
{id:'pneumothorax',title:'病例 02 · 左侧气胸',level:'进阶',img:'https://commons.wikimedia.org/wiki/Special:FilePath/X-ray%20subtle%20pneumothorax%20in%20inspiration.jpg',source:'https://commons.wikimedia.org/wiki/File:X-ray_subtle_pneumothorax_in_inspiration.jpg',credit:'Mikael Häggström，CC0',target:{x:68,y:16,w:18,h:18},steps:[
{kind:'choice',title:'先判断可疑征象',prompt:'下列哪项最值得在肺尖区域进一步核对？',opts:['肺纹理是否延伸至胸壁','双侧肋膈角是否锐利','心影是否增大','膈肌是否抬高'],answer:0,feedback:'正确。怀疑气胸时，肺尖与胸壁之间是否缺少肺血管纹理是关键检查点之一。'},
{kind:'locate',title:'在图上定位',prompt:'请点击最可疑的区域。提示：患者左侧在屏幕右侧。',feedback:'本例来源说明：吸气相片仅在患者左侧胸腔肺尖部出现细微气胸征象，最上方肺段缺少血管纹理。'},
{kind:'choice',title:'选择规范描述',prompt:'哪一项描述最贴近本例的关键发现？',opts:['左肺尖胸壁侧肺血管纹理减少','右上肺叶局灶性实变','双侧胸腔积液','纵隔向右明显移位'],answer:0,feedback:'正确。教学重点是识别细微征象并说明其位置；本练习不要求你仅凭单张片子评估病情严重程度。'}]},
{id:'normal',title:'病例 03 · 正常对照片',level:'巩固',img:'https://commons.wikimedia.org/wiki/Special:FilePath/Chest%20X-Ray.jpg',source:'https://commons.wikimedia.org/wiki/File:Chest_X-Ray.jpg',credit:'公开教学影像，公共领域',target:null,steps:[
{kind:'choice',title:'先避免过度诊断',prompt:'与前两例相比，这张片上是否有明确的局灶性肺野异常需要优先解释？',opts:['有','没有'],answer:1,feedback:'正确。正常对照片的价值在于校准“正常结构和对称性”的印象，避免把不确定影像强行解释为异常。'},
{kind:'choice',title:'建立可复用的复核顺序',prompt:'完成胸片初读后，以下哪种复核顺序更稳妥？',opts:['直接猜诊断','图像质量 → 气道/纵隔 → 肺野/胸膜 → 心影/膈肌/骨软组织','只看最亮的区域','只比较左右肺尖'],answer:1,feedback:'正确。系统复核不能保证不漏诊，但能显著降低“只看一处”的随意性。'}]}
];
let ci=0,si=0,selected=-1,click=null,checked=false;const $=s=>document.querySelector(s);const store=()=>JSON.parse(localStorage.getItem('chex-case-practice')||'{}');const save=s=>localStorage.setItem('chex-case-practice',JSON.stringify(s));
function renderList(){const s=store();$('#caseList').innerHTML=cases.map((c,i)=>`<button class="case ${i===ci?'active':''} ${s[c.id]?.done?'done':''}" data-case="${i}"><b>${c.title}</b><small>${c.level} · ${s[c.id]?.done?'已完成':'待练习'}</small><span class="status">${i===ci?'当前病例':s[c.id]?.done?'已复盘':'未开始'}</span></button>`).join('');document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>{ci=+b.dataset.case;si=0;selected=-1;click=null;checked=false;render()})}
function setImageTransform(){const z=+$('#zoom').value||100;$('#caseImage').style.transform=`scale(${z/100})`;$('#caseImage').style.transformOrigin='center'}
function render(){const c=cases[ci],step=c.steps[si];selected=-1;click=null;checked=false;$('#caseTitle').textContent=c.title;$('#caseImage').src=c.img;$('#meta').innerHTML=`影像来源：<a class="source" href="${c.source}" target="_blank" rel="noreferrer">查看公开原始资料</a> · ${c.credit}`;$('#viewerState').textContent=si===0?'盲读':'任务 '+(si+1)+' / '+c.steps.length;$('#dot').classList.remove('show');$('#target').classList.remove('show');$('#imageTip').textContent=step.kind==='locate'?'请在影像上点击你认为的异常位置。':'先独立阅片，再在右侧作答。';let html=`<h1>${step.title}</h1><p class="stage">病例 ${String(ci+1).padStart(2,'0')} · 任务 ${si+1}/${c.steps.length}</p><div class="instruction">${step.prompt}</div>`;
if(step.kind==='choice'){html+=`<div class="choices">${step.opts.map((x,i)=>`<button class="choice" data-choice="${i}">${String.fromCharCode(65+i)}．${x}</button>`).join('')}</div><button class="primary" id="submit" disabled>提交答案</button>`}else{html+=`<button class="primary" id="submit" disabled>确认定位</button>`}html+=`<div id="feedback" class="feedback"></div><div id="explanation" class="explanation"><h2>讲解与复盘</h2><p>${step.feedback}</p><p><b>学习动作：</b>${step.kind==='locate'?'将你的点击与黄色范围比较，再回到胸片核对边界和肺纹理。':'不要只记住答案；重新在图上找到支持或排除该答案的影像证据。'}</p></div><div class="zoomrow"><span>缩放</span><input id="zoom" type="range" min="80" max="180" value="100"><span id="zoomVal">100%</span></div><p class="note">选择或定位后会给出即时反馈。病例完成后可随时重新练习。</p>`;$('#taskPanel').innerHTML=html;$('#zoom').oninput=e=>{$('#zoomVal').textContent=e.target.value+'%';setImageTransform();requestAnimationFrame(()=>{if(click)place($('#dot'),click);if($('#target').classList.contains('show'))revealTarget(c.target)})};if(step.kind==='choice')document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{selected=+b.dataset.choice;document.querySelectorAll('[data-choice]').forEach(x=>x.classList.toggle('selected',+x.dataset.choice===selected));$('#submit').disabled=false});$('#submit').onclick=check;renderList()}
function imageBox(){const z=$('#imageZone').getBoundingClientRect(),i=$('#caseImage').getBoundingClientRect();return{left:i.left-z.left,top:i.top-z.top,width:i.width,height:i.height}}function place(el,p){const b=imageBox();el.style.left=(b.left+b.width*p.x/100)+'px';el.style.top=(b.top+b.height*p.y/100)+'px'}function relative(e){const z=$('#imageZone').getBoundingClientRect(),b=imageBox(),x=e.clientX-z.left,y=e.clientY-z.top;if(x<b.left||x>b.left+b.width||y<b.top||y>b.top+b.height)return null;return{x:(x-b.left)/b.width*100,y:(y-b.top)/b.height*100}}$('#imageZone').onclick=e=>{const step=cases[ci].steps[si];if(step.kind!=='locate'||checked)return;click=relative(e);if(!click){$('#imageTip').textContent='请在实际影像范围内点击，而不是黑色背景。';return}const d=$('#dot');place(d,click);d.classList.add('show');$('#submit').disabled=false;$('#imageTip').textContent='已记录你的定位。点击“确认定位”获得反馈。'};
function revealTarget(t){const el=$('#target'),b=imageBox();el.style.left=(b.left+b.width*(t.x-t.w/2)/100)+'px';el.style.top=(b.top+b.height*(t.y-t.h/2)/100)+'px';el.style.width=b.width*t.w/100+'px';el.style.height=b.height*t.h/100+'px';el.classList.add('show')}
function check(){const c=cases[ci],step=c.steps[si];checked=true;let correct;if(step.kind==='choice')correct=selected===step.answer;else{const t=c.target;correct=Math.hypot((click.x-t.x)/t.w,(click.y-t.y)/t.h)<1;revealTarget(t)}const fb=$('#feedback');fb.className='feedback show '+(correct?'':'bad');fb.textContent=correct?'回答正确。请阅读讲解，并回到影像确认依据。':'这次不完全正确。黄色范围显示本题教学关注的位置；请结合讲解再核对。';$('#explanation').classList.add('show');$('#submit').textContent=si<c.steps.length-1?'进入下一任务':'完成本病例';$('#submit').onclick=next;$('#imageTip').textContent='黄色范围为本题教学标注，不代表完整病灶边界。'}
function next(){const c=cases[ci];if(si<c.steps.length-1){si++;render();return}const s=store();s[c.id]={done:true,finishedAt:new Date().toISOString()};save(s);renderList();$('#taskPanel').innerHTML=`<div class="summary show"><h1>病例已完成</h1><p class="stage">${c.title}</p><div class="explanation show"><h2>你刚刚练习了什么</h2><ul>${c.steps.map(x=>`<li>${x.title}</li>`).join('')}</ul><p>建议重新打开病例，在不看反馈的情况下再完成一次；如果第二次仍能准确定位并描述，才算真正掌握。</p></div><button class="primary" id="restart">重新练习本例</button>${ci<cases.length-1?'<button class="quiet" id="nextCase">下一病例</button>':''}<p class="note">病例结论以页面所列公开来源为准，教学内容后续应由临床教师复核扩充。</p></div>`;$('#restart').onclick=()=>{si=0;render()};if($('#nextCase'))$('#nextCase').onclick=()=>{ci++;si=0;render()}}
render();
</script></body></html>
